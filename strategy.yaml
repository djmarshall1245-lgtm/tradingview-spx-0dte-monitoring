version: v02
owner: djmarshall1245@gmail.com
go_live: 2026-06-22
account:
  broker: robinhood
  subaccount: "****3232"
  starting_capital_usd: 1000
  capital_type: real
  intent: "spin and grow the account, not gamble"

instrument:
  type: equity_options
  legs: single_leg
  side: [long_call, long_put]
  universe: liquid_names_only
  premium_per_contract_usd: [1.00, 1.50]   # v02: shrunk from $3-5 to fit $1k

direction:
  allow_long: true
  allow_short: true

entry:
  grade: "A+ only"
  required_confluence:
    - "Unusual Whales flow >= 6:1 (calls:puts or puts:calls in signal direction)"
    - "gauge confirms direction"
    - "chart aligned with signal"
  all_three_required: true

concurrency:
  max_open_positions: 2

exits:
  take_profit_pct: [50, 100]
  hard_stop_pct: -40
  stop_exceptions: none
  intent: "stack singles, no home runs"

execution:
  order_type: limit_only
  limit_price: mid
  workflow:
    - "Claude finds setup"
    - "Claude presents: ticker / strike / expiry / limit @ mid"
    - "User says GO"
    - "review_option_order (preview cost, BP, fees) — show user"
    - "place_option_order (limit, single-leg, ****3232)"
    - "confirm fill, log trade #"

risk_controls:
  per_trade_risk_target_pct: 5            # v02: realistic for $1.00-1.50 premiums
  max_drawdown_pct: 10
  daily_loss_cap_trades: 2                # 2 losses = done for the day
  weekly_review: true

# ---------------------------------------------------------------------------
# Sizing math at $1.00-1.50 premiums (this is why v02 works):
#   1 contract @ $1.25      = $125 cost           (12.5% of $1k tied up)
#   -40% stop on $125       = -$50 loss           (5% account risk per trade)
#   2 losers in a day       = -$100               (10% drawdown — at the cap)
#   2 concurrent positions  = $250 max BP used    (25% of account)
#   Account can absorb ~20 losing trades before exhaustion (vs ~5 at $3-5).
# ---------------------------------------------------------------------------

# Notes carried from v01:
# - reward:risk ratio: stated "3 to 1" but TP +50-100% vs stop -40% =
#   1.25:1 to 2.5:1. TP band governs unless changed.
# - hard stop -40% (this file) supersedes the -50% in CLAUDE.md for equity
#   options. SPX 0DTE rules in CLAUDE.md unchanged.
# - tradeoff accepted: $1.00-1.50 premiums tend to be slightly further OTM
#   or lower delta than $3-5. Slightly lower per-trade hit rate, but the
#   account survives long enough for the A+ edge to play out.

# Scale-up plan:
#   account >= $2,500  -> v03: premium band $1.50-2.50
#   account >= $5,000  -> v04: premium band $3.00-5.00 (original v01 band)
