version: v03
owner: djmarshall1245@gmail.com
go_live: 2026-06-22
account:
  broker: robinhood
  subaccount: "****3232"
  starting_capital_usd: 1000
  capital_type: real
  intent: "spin and grow the account, not gamble"

# ═══════════════════════════════════════════════════════════════════════
# v03 ONE-VARIABLE CHANGE FROM v02:
#   Added an objective function (none existed). Everything else is the
#   scaffolding that objective requires to be measurable (schemas,
#   learning loop). No behavioral rules changed from v02.
# ═══════════════════════════════════════════════════════════════════════

objective:
  primary_metric: expectancy_per_trade
  formula: "(win_rate * avg_win_$) - (loss_rate * avg_loss_$)"
  units: dollars_per_trade
  target: positive_and_rising_over_rolling_20_trades
  constraint:
    max_daily_drawdown_pct: 10
    max_total_drawdown_pct: 20
    breach_behavior: halt_and_ask_user
  improvement_definition: |
    Expectancy rises over a rolling 20-trade window WITHOUT loosening
    any hard rail. Improvement = better-quality setups, not bigger bets
    and not wider stops.
  goodhart_guards:
    - "Win rate alone is NOT the objective. A 90% win rate with -40% stops
      and +5% wins is a losing system. Expectancy is the truth."
    - "Shrinking TP targets to lift win rate = forbidden. Gaming the metric."
    - "Widening stops to avoid losses = forbidden. Gaming the metric."
    - "Sizing up after a win streak = forbidden. Goal is consistency, not parlay."

instrument:
  type: equity_options
  legs: single_leg
  side: [long_call, long_put]
  universe: liquid_names_only
  premium_per_contract_usd: [1.00, 1.50]

direction:
  allow_long: true
  allow_short: true

entry:
  grade: "A+ only"
  required_confluence:
    - "Unusual Whales flow >= 6:1 in trade direction"
    - "gauge confirms direction"
    - "chart aligned with signal"
  all_three_required: true

concurrency:
  max_open_positions: 2

exits:
  take_profit_pct: [50, 100]
  hard_stop_pct: -40
  stop_exceptions: none
  intent: "stack singles, no home runs"

execution:
  order_type: limit_only
  limit_price: mid
  workflow:
    - "Claude finds setup"
    - "Claude presents: ticker / strike / expiry / limit @ mid"
    - "User says GO"
    - "review_option_order (preview cost, BP, fees) — show user"
    - "place_option_order (limit, single-leg, ****3232)"
    - "confirm fill, log trade #, append to trades.jsonl"

risk_controls:
  per_trade_risk_target_pct: 5
  max_drawdown_pct: 10
  daily_loss_cap_trades: 2
  weekly_review: true

# ═══════════════════════════════════════════════════════════════════════
# HERMES SPINE — what the AI may NEVER change via the learning loop.
# These are constitutional. The loop can change PROPOSALS, not these.
# ═══════════════════════════════════════════════════════════════════════
hard_rails_locked:
  - hard_stop_pct                  # -40%, no exceptions
  - max_drawdown_pct               # 10% daily
  - max_total_drawdown_pct         # 20% total
  - daily_loss_cap_trades          # 2 losers and done
  - max_open_positions             # 2
  - execution.order_type           # limit only
  - execution.workflow             # manual GO step is sacred
  - objective.primary_metric       # don't pivot off expectancy without me

# ═══════════════════════════════════════════════════════════════════════
# HERMES SPINE — journal schemas. trades.jsonl and hypotheses.jsonl
# are append-only logs the AI reads fresh each session.
# ═══════════════════════════════════════════════════════════════════════
schemas:
  trades_jsonl:
    fields:
      - trade_id              # uuid
      - ts_entry              # ISO 8601
      - ts_exit               # ISO 8601 (null if open)
      - ticker
      - side                  # call | put
      - strike
      - expiry                # YYYY-MM-DD
      - premium_paid          # per contract, $
      - contracts             # int
      - cost_usd              # contracts * premium * 100
      - exit_price            # per contract, $ (null if open)
      - exit_reason           # see enum
      - pnl_usd
      - pnl_pct               # vs cost basis
      - regime                # see enum (from macro gate)
      - gates_passed          # ["macro","a_plus","concentration","gut"]
      - strategy_version      # which strategy.yaml version was active
      - hypothesis_id         # which weekly hypothesis this trade tests
      - notes                 # one-line freeform
    exit_reason_enum: [tp_hit, stop_hit, invalidation, time_stop, manual_close]
    regime_enum: [trend_up, trend_down, chop, event_driven]
  hypotheses_jsonl:
    fields:
      - hypothesis_id         # uuid
      - week_of               # ISO date of Monday
      - strategy_version
      - one_variable_change   # the ONE thing being tested
      - prediction            # what we expect to see
      - success_metric        # e.g. "expectancy > $20 over >=5 trades"
      - result                # see enum
      - evaluated_on          # ISO date when filled in
    result_enum: [confirmed, refuted, insufficient_data, pending]

# ═══════════════════════════════════════════════════════════════════════
# Learning loop — runs every Friday at close (see friday_loop.md)
# ═══════════════════════════════════════════════════════════════════════
learning_loop:
  cadence: weekly_friday_close
  process:
    - "compute expectancy + win rate + avg win + avg loss from trades.jsonl (last 5 trading days)"
    - "cluster by regime; flag which regimes are working"
    - "evaluate last week's hypothesis: confirmed / refuted / insufficient_data"
    - "propose ONE new hypothesis (one-variable rule) for next week"
    - "append to hypotheses.jsonl"
    - "if expectancy negative for 2 consecutive weeks -> halt and review with user"
    - "if a hard rail in hard_rails_locked is proposed for change -> reject, escalate to user"
  one_variable_rule: |
    Each strategy version may change exactly ONE behavioral input from the
    prior version (e.g. flow ratio threshold, premium band, concentration
    rule). When results shift, you know what caused it. No shotgun edits.

# Scale-up plan:
#   account >= $2,500  -> premium band $1.50-2.50
#   account >= $5,000  -> premium band $3.00-5.00
